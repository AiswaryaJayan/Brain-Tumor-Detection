<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Image</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ADD8E6; /* Background color of the page */
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .container {
            text-align: center;
            padding: 20px;
            background-color: #808080; /* Box color */
            border: 1px solid #ccc;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            width: 50%; /* Adjust the width of the box */
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container h1 {
            margin-bottom: 20px;
            color: #000000; /* Text color */
        }
        .container form {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }
        .container label {
            margin-bottom: 10px;
        }
        .container input[type="file"] {
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 80%;
            box-sizing: border-box;
        }
        .container button {
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        .container button:hover {
            background-color: #0056b3;
        }
        .container img {
            max-width: 50%; /* Decrease the width to 50% of the container */
            margin-top: 20px; /* Add margin above the image */
            align-self: center; /* Center the image horizontally */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Upload Your MRI Film of Brain for Tumor Analysis:</h1>
        <form id="imageForm" action="/predict" method="post" enctype="multipart/form-data">
            <input type="file" id="image" name="image" accept="image/*" required onchange="showImage(event)">
            <button type="submit">Prediction</button>
        </form>
        <img id="selectedImage" src="#" alt="Selected Image" style="display:none;">
    </div>

    <script>
        function showImage(event) {
            var imgElement = document.getElementById('selectedImage');
            var file = event.target.files[0];
            var reader = new FileReader();

            reader.onload = function(e) {
                imgElement.src = e.target.result;
                imgElement.style.display = 'block'; // Display the image
            };

            reader.readAsDataURL(file); // Read the selected file as a data URL
        }
    </script>
</body>
</html>
